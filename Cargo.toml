[package]
name = "netzipapi-rust-demo"
version = "0.1.0"
edition = "2024"
autobins = false

[[bin]]
name = "netzipapi-rust-demo"
path = "src/main.rs"

[[bin]]
name = "quoteNetzipRs"
path = "src/bin/netzip_service.rs"

[[bin]]
name = "netzip_linux"
path = "src/bin/netzip_linux.rs"

[workspace]
members = [".", "crates/tuwenca-codec", "crates/stockdrv-compat"]
resolver = "2"

[dependencies]
axum = "0.8.9"
encoding_rs = "0.8.35"
flate2 = "1.1.10"
libloading = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rmp-serde = "1.3.1"
crc32fast = "1.5.1"
netzip-fullpull = { path = "../crates/netzip-fullpull" }
netzip-supplement = { path = "../crates/netzip-supplement" }
pinyin = "0.11.0"
tuwenca-codec = { path = "crates/tuwenca-codec" }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net"] }
zstd = "0.13.3"
