[package]
name = "netzipapi-rust-demo"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "crates/tuwenca-codec", "crates/stockdrv-compat"]
resolver = "2"

[dependencies]
axum = "0.8.6"
encoding_rs = "0.8"
flate2 = "1.1.5"
libloading = "0.8.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1"
crc32fast = "1"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "net"] }
zstd = "0.13.3"
