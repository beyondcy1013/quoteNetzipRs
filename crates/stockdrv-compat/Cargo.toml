[package]
name = "stockdrv-compat"
version = "0.1.0"
edition = "2024"

[lib]
name = "Stockdrv"
crate-type = ["cdylib", "rlib"]

[dependencies]
encoding_rs = "0.8.35"
libloading = "0.9.0"
serde_json = "1.0.151"
tuwenca-codec = { path = "../tuwenca-codec" }

[dev-dependencies]
netzip-fullpull = { path = "../../../crates/netzip-fullpull" }
serde = { version = "1.0.229", features = ["derive"] }
